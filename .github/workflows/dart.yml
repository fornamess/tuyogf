name: Flutter CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Check project structure
        run: |
          echo "Current directory: $(pwd)"
          ls -la
          if [ -d "cashflow" ]; then
            echo "cashflow directory found"
            ls -la cashflow/
          else
            echo "cashflow directory not found!"
            exit 1
          fi

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.6'
          channel: 'stable'
          cache: true

      - name: Setup Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev mesa-utils
          yes | flutter doctor --android-licenses || true

      - name: Install dependencies
        working-directory: ./cashflow
        run: flutter pub get

      - name: Analyze project source
        working-directory: ./cashflow
        continue-on-error: true
        run: |
          flutter analyze || echo "Analysis found issues but continuing..."
          echo "Analysis step completed"

      - name: Run tests
        working-directory: ./cashflow
        continue-on-error: true
        run: |
          if [ -d "test" ]; then
            echo "Running tests..."
            flutter test || echo "Tests failed but continuing..."
          else
            echo "No test directory found, skipping tests"
          fi

      - name: Verify build setup
        run: |
          echo "Checking Flutter doctor..."
          flutter doctor -v
          echo "Flutter setup verification completed"
