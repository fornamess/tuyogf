name: Flutter CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Check project structure
        run: |
          echo "Current directory: $(pwd)"
          ls -la
          if [ -f "pubspec.yaml" ]; then
            echo "pubspec.yaml found, we're in the Flutter project root"
          else
            echo "pubspec.yaml not found!"
            exit 1
          fi

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.6'
          channel: 'stable'
          cache: true

      - name: Setup Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev mesa-utils
          yes | flutter doctor --android-licenses || true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze project source
        continue-on-error: true
        run: |
          flutter analyze || echo "Analysis found issues but continuing..."
          echo "Analysis step completed"

      - name: Run tests
        continue-on-error: true
        run: |
          if [ -d "test" ]; then
            echo "Running tests..."
            flutter test || echo "Tests failed but continuing..."
          else
            echo "No test directory found, skipping tests"
          fi

      - name: Verify build setup
        run: |
          echo "Checking Flutter doctor..."
          flutter doctor -v
          echo "Flutter setup verification completed"

      - name: Build Android APK
        run: |
          echo "Building Android APK..."
          flutter build apk --release
          ls -la build/app/outputs/flutter-apk/

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: build/app/outputs/flutter-apk/*.apk
          retention-days: 30
